# main への push（人間によるマージ）で本番にデプロイする。
# auto-improve ワークフローは自分でデプロイするので、そちらのマージではこのワークフローは動かない
# （GITHUB_TOKEN による push は他のワークフローを起動しない）。
# 有効にするには Variables に DEPLOY_FROM_ACTIONS = "true" を設定する。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cloudflare のシークレットが未設定なら何もしない
    if: vars.DEPLOY_FROM_ACTIONS == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: マイグレーションとデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply robot-empire --remote
          npm run build:cf
          npx opennextjs-cloudflare deploy
